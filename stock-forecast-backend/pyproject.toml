[project]
name = "stock-forecast-backend"
version = "0.1.0"
description = "Real-time stock forecast backend using Keras LSTM model trained on MOEX data"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "numpy>=1.26,<3",
    "requests>=2.32.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
