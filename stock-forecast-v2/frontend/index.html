/* ── MINI CHART ───────────────────────────────────────────────── */
function MiniChart({points}) {
  if(!points || points.length < 2) return null;
  const W=340, H=72, PAD=4;
  const min = Math.min(...points), max = Math.max(...points);
  const range = max - min || 1;
  const xs = points.map((_,i)=>PAD + (i/(points.length-1))*(W-PAD*2));
  const ys = points.map(p=>PAD + (1-(p-min)/range)*(H-PAD*2));
  const pathD = xs.map((x,i)=>`${i===0?'M':'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const areaD = pathD + ` L${xs[xs.length-1].toFixed(1)},${H} L${xs[0].toFixed(1)},${H} Z`;
  const isUp = points[points.length-1] >= points[0];
  const lineColor = isUp ? '#4ade80' : '#f87171';
  const gradId = `cg${Math.round(points[0]*10)}`;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{display:'block',borderRadius:8,overflow:'visible'}}>
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={lineColor} stopOpacity="0.18"/>
          <stop offset="100%" stopColor={lineColor} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={areaD} fill={`url(#${gradId})`}/>
      <path d={pathD} fill="none" stroke={lineColor} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={xs[xs.length-1]} cy={ys[ys.length-1]} r="3" fill={lineColor}/>
    </svg>
  );
}

/* ── PARTICLES ────────────────────────────────────────────────── */
function ParticlesCanvas() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let raf, w, h;
    const pts = [];
    const resize = () => { w = canvas.width = canvas.offsetWidth; h = canvas.height = canvas.offsetHeight; };
    resize();
    window.addEventListener('resize', resize);
    for(let i=0;i<80;i++){
      pts.push({ x:Math.random()*1400, y:Math.random()*800, vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3, r:Math.random()*1.6+0.4, a:Math.random()*Math.PI*2, color: Math.random()>0.5 ? [124,58,237] : [6,182,212] });
    }
    const draw = () => {
      ctx.clearRect(0,0,w,h);
      pts.forEach(p=>{
        p.x+=p.vx; p.y+=p.vy; p.a+=0.008;
        if(p.x<0)p.x=w; if(p.x>w)p.x=0; if(p.y<0)p.y=h; if(p.y>h)p.y=0;
        const o = 0.3+0.2*Math.sin(p.a);
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(${p.color[0]},${p.color[1]},${p.color[2]},${o})`; ctx.fill();
      });
      for(let i=0;i<pts.length;i++){
        for(let j=i+1;j<pts.length;j++){
          const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=Math.sqrt(dx*dx+dy*dy);
          if(d<100){ ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y);
            ctx.strokeStyle=`rgba(124,58,237,${0.08*(1-d/100)})`; ctx.lineWidth=0.5; ctx.stroke(); }
        }
      }
      raf=requestAnimationFrame(draw);
    };
    draw();
    return ()=>{ cancelAnimationFrame(raf); window.removeEventListener('resize',resize); };
  },[]);
  return <canvas ref={canvasRef} id="particles-canvas" style={{width:'100%',height:'100%'}}/>;
}

/* ── PROGRESS BAR ─────────────────────────────────────────────── */
function ProgressBar({value,color,animated}) {
  const [width,setWidth] = useState(0);
  useEffect(()=>{if(animated){const t=setTimeout(()=>setWidth(value),100);return()=>clearTimeout(t);}else{setWidth(value);}},[value,animated]);
  return (
    <div style={{height:6,borderRadius:99,background:'rgba(255,255,255,0.07)',overflow:'hidden'}}>
      <div style={{height:'100%',borderRadius:99,width:`${width}%`,background:color||'#7c3aed',transition:'width 1.2s cubic-bezier(0.16,1,0.3,1)'}}/>
    </div>
  );
}

/* ── COUNTER ANIM ─────────────────────────────────────────────── */
function AnimCounter({target}) {
  const [val,setVal] = useState(0);
  useEffect(()=>{
    let start=0, raf;
    const dur=1200, step=()=>{
      start+=16;
      const p=Math.min(start/dur,1);
      const ease=1-Math.pow(1-p,4);
      setVal(Math.round(ease*target));
      if(p<1) raf=requestAnimationFrame(step);
    };
    const t=setTimeout(()=>{ raf=requestAnimationFrame(step); },200);
    return()=>{clearTimeout(t);cancelAnimationFrame(raf);};
  },[target]);
  return <>{val}</>;
}

/* ── FORECAST (REAL API) ──────────────────────────────────────── */
function Forecast({company}) {
  const [loading,setLoading] = useState(false);
  const [result,setResult] = useState(null);
  const [error, setError] = useState(null);
  const [loadStep, setLoadStep] = useState('queued');
  const [showDetail,setShowDetail] = useState(false);
  const pollRef = useRef(null);

  useEffect(()=>{ setResult(null); setShowDetail(false); setError(null); },[company]);

  const doForecast = async () => {
    setLoading(true); setResult(null); setShowDetail(false); setError(null); setLoadStep('queued');
    try {
      const startRes = await fetch(`${API_BASE}/api/predict_job/${company.ticker}`, {method:'POST'});
      if(!startRes.ok) {
        const err = await startRes.json().catch(()=>({detail:'Server error'}));
        throw new Error(err.detail || 'Failed to start prediction');
      }
      const {job_id} = await startRes.json();

      const poll = async () => {
        try {
          const r = await fetch(`${API_BASE}/api/predict_job/${job_id}`);
          const data = await r.json();
          setLoadStep(data.step || 'running');

          if(data.status === 'done') {
            setResult(data.result);
            setLoading(false);
            return;
          }
          if(data.status === 'error') {
            const detail = data.error?.detail || data.error?.message || 'Unknown error';
            throw new Error(detail);
          }
          pollRef.current = setTimeout(poll, 800);
        } catch(e) {
          setError(e.message);
          setLoading(false);
        }
      };
      pollRef.current = setTimeout(poll, 500);
    } catch(e) {
      setError(e.message);
      setLoading(false);
    }
  };

  useEffect(()=>()=>clearTimeout(pollRef.current),[]);

  if(!company) return null;

    success:{bg:'rgba(34,197,94,0.1)',border:'rgba(34,197,94,0.25)',color:'#4ade80'},

    warning:{bg:'rgba(234,179,8,0.1)',border:'rgba(234,179,8,0.25)',color:'#facc15'},

    <section id="forecast" style={{padding:'80px 0',borderTop:'1px solid rgba(255,255,255,0.05)'}}>

          <div style={{width:52,height:52,borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
            background:`linear-gradient(135deg,${sec.color}22,${sec.color}44)`,border:`1px solid ${sec.color}44`}}>

            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>

              <div style={{padding:'3px 10px',borderRadius:99,background:sec.bg,border:`1px solid ${sec.color}33`,fontSize:11,fontWeight:600,color:sec.color}}>{sec.label}</div>
            </div>
            <div style={{fontSize:13,color:'rgba(255,255,255,0.4)',marginTop:2}}>{company.name}</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.3)',letterSpacing:'0.04em',fontWeight:600}}>ГОРИЗОНТ: 5 ДНЕЙ</div>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.2)',marginTop:2}}>Keras LSTM (Sonnet v3)</div>

}

/* ── APP ──────────────────────────────────────────────────────── */
function App() {
  const [selectedCompany, setSelectedCompany] = useState(null);

  const scrollTo = (id) => {
    const el = document.querySelector(id);
    if(el) window.scrollTo({top:el.offsetTop-60, behavior:'smooth'});
  };

  const handleSelectCompany = (company) => {
    setSelectedCompany(company);
    setTimeout(()=>{
      const el = document.querySelector('#forecast');
      if(el) window.scrollTo({top:el.offsetTop-70, behavior:'smooth'});
    }, 50);
  };

  return (
    <>
      <Nav onNav={id=>{
        if(id==='#forecast'&&!selectedCompany){ scrollTo('#catalog'); return; }
        scrollTo(id);
      }}/>
      <main>
        <Hero onStart={()=>scrollTo('#catalog')}/>
        <Catalog onSelect={handleSelectCompany}/>
        {selectedCompany && <Forecast key={selectedCompany.ticker} company={selectedCompany}/>}
        <About/>
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
