# Copy to settings.yaml and fill in. Real file is git-ignored.
# Values here are also overridable via env vars (LLM_API_KEY, LLM_ENDPOINT, LLM_MODEL).
llm:
  api_key: "${LLM_API_KEY}"
  endpoint: "http://localhost:20128/v1/chat/completions"
  model: "openrouter/owl-alpha"

  # Tuned per stage inside the pipeline; these are fallback defaults.
  timeout_seconds: 120
  max_retries: 3

pipeline:
  # If validator fails, how many times to ask Writer to rewrite with feedback.
  max_writer_retries: 2

  # Hard length bounds (words). Validator will reject outside this range.
  min_words: 100
  max_words: 130

  # Concurrency for batch generation.
  max_concurrent: 5
